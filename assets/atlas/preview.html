const out = document.getElementById('out');
const guidesBox = document.getElementById('guides');
const speedBox = document.getElementById('speed');

for (const m of MANIFESTS) {
  const img = new Image();
  img.src = m.image;
  const atlas = MANIFESTS_ATLAS[m.atlas];

  const section = document.createElement('section');
  section.innerHTML = '<h2>' + m.id + '  ·  ' + m.frameSize.w + '×' + m.frameSize.h +
                      '  ·  anchor (' + m.anchor.x + ', ' + m.anchor.y + ') ' + m.anchor.kind + '</h2>';
  const row = document.createElement('div');
  row.className = 'row';
  section.appendChild(row);
  out.appendChild(section);

  for (const [name, anim] of Object.entries(m.animations)) {
    const fig = document.createElement('figure');
    fig.className = 'cell';
    fig.style.margin = '0';
    const cv = document.createElement('canvas');
    cv.width = m.frameSize.w;
    cv.height = m.frameSize.h;
    fig.appendChild(cv);
    const cap = document.createElement('figcaption');
    cap.textContent = name + '  (' + anim.frames.length + 'f @ ' + anim.frameRate + ')';
    fig.appendChild(cap);
    row.appendChild(fig);

    const ctx = cv.getContext('2d');
    let i = 0, last = 0;
    function draw(t) {
      const step = 1000 / (anim.frameRate * (speedBox.value / 100));
      if (t - last > step) { i = (i + 1) % anim.frames.length; last = t; }
      ctx.clearRect(0, 0, cv.width, cv.height);
      if (guidesBox.checked) {
        ctx.strokeStyle = 'rgba(217,164,65,.55)'; ctx.beginPath();
        ctx.moveTo(0, m.anchor.y + .5); ctx.lineTo(cv.width, m.anchor.y + .5); ctx.stroke();
        ctx.strokeStyle = 'rgba(79,214,232,.35)'; ctx.beginPath();
        ctx.moveTo(m.anchor.x + .5, 0); ctx.lineTo(m.anchor.x + .5, cv.height); ctx.stroke();
      }
      const key = m.id + '.' + anim.frames[i];
      const f = atlas && atlas.frames[key];
      if (f && img.complete) {
        ctx.drawImage(img, f.frame.x, f.frame.y, f.frame.w, f.frame.h, 0, 0, f.frame.w, f.frame.h);
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  }
}
